name: Hourly Web3 scan

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scan.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          NITTER_INSTANCES: ${{ secrets.NITTER_INSTANCES }}
          EXTRA_FEEDS: ${{ secrets.EXTRA_FEEDS }}
          
